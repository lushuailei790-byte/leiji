<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>磊集 LEIJI · 设计师素材台</title>
<meta name="description" content="磊集 LEIJI —— 为平面 / 3D / 空间设计师做的素材管理台：采集、分类、标签、配色检索，随时翻出参考图。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F3F0E8; --panel:#FFFFFF; --panel2:#FAF8F3; --panel3:#F0ECE1;
    --ink:#1B1813; --ink2:#514A3D; --muted:#867E6F;
    --line:#E6DFCF; --line2:#D4CAB5;
    --accent:#E4441D; --accent-hover:#B92F12; --accent-ink:#B92F12; --accent-soft:#FCEAE3; --accent-on:#fff;
    --accent-on-inv:var(--accent);
    --ok:#0F766E; --ok-soft:#E4F2EF;
    --bar-bg:rgba(243,240,232,.9);
    --hover:rgba(27,24,19,.055); --hover2:rgba(27,24,19,.1);
    --inverse-soft:rgba(255,255,255,.14); --inverse-soft2:rgba(255,255,255,.26);
    --sb:#CFC6B2; --sbh:#B8AE97;
    --side:250px; --top:58px; --r:12px;
    --cw:196px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  /* 深色工具模式（借鉴美叶：白底看品味 · 深底干活） */
  html[data-theme="dark"]{
    --bg:#131211; --panel:#1C1A18; --panel2:#201E1B; --panel3:#2A2723;
    --ink:#F4EFE6; --ink2:#C7BFB1; --muted:#8B8375;
    --line:#312D28; --line2:#454038;
    --accent:#F0441C; --accent-hover:#FF5C34; --accent-ink:#FF8A66; --accent-soft:#3A1D14; --accent-on:#fff;
    --accent-on-inv:var(--accent-hover);
    --ok:#19A08D; --ok-soft:#12302C;
    --bar-bg:rgba(19,18,17,.9);
    --hover:rgba(255,255,255,.06); --hover2:rgba(255,255,255,.1);
    --inverse-soft:rgba(0,0,0,.12); --inverse-soft2:rgba(0,0,0,.2);
    --sb:#3A352E; --sbh:#4C463D;
  }
  /* 强调色 · 美叶同款荧光黄绿 */
  html[data-accent="lime"]{ --accent:#DFFF1F; --accent-hover:#C7E800; --accent-ink:#5E7A00; --accent-soft:#F4FFC7; --accent-on:#1B1813; }
  html[data-theme="dark"][data-accent="lime"]{ --accent:#CDEB1C; --accent-hover:#B7D406; --accent-ink:#D9F26B; --accent-soft:#242B05; --accent-on:#131211; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:none;cursor:pointer;text-align:left}
  ::selection{background:var(--accent);color:var(--accent-on)}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .disp{font-family:"Bricolage Grotesque","Noto Sans SC",sans-serif}
  .hide{display:none!important}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:9px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sbh);background-clip:content-box}

  /* ---------- topbar ---------- */
  header.top{flex:0 0 var(--top);height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:60}
  .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:18px;position:relative;overflow:hidden;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(128,128,128,.35) 6px 7px)}
  .brand .w{display:flex;flex-direction:column;line-height:1}
  .brand .w b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15.5px}
  .brand .w i{font-style:normal;font-size:9px;letter-spacing:.28em;color:var(--muted);margin-top:3px}
  .search{flex:1 1 auto;max-width:560px;position:relative;display:flex;align-items:center;margin-left:8px}
  .search svg{position:absolute;left:12px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
  .search input{width:100%;background:var(--panel3);border:1px solid var(--line);border-radius:9px;padding:9px 13px 9px 34px;font-size:13.5px;outline:none;transition:.18s}
  .search input:focus{background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .top .sp{flex:1}
  .seg{display:flex;background:var(--panel3);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
  .seg button{padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--ink2);display:grid;place-items:center;transition:.15s}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .seg svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  select.sel{background:var(--panel3);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;color:var(--ink2);outline:none}
  .btn-acc{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-on);font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:9px;box-shadow:0 8px 18px -12px var(--accent);transition:.18s;flex:0 0 auto}
  .btn-acc:hover{background:var(--accent-hover)}
  .btn-acc svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4}
  .iconbtn{width:36px;height:36px;border-radius:9px;display:none;place-items:center;border:1px solid var(--line);background:var(--panel3)}
  .iconbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2}
  .ibtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel3);flex:0 0 auto;transition:.15s}
  .ibtn:hover{border-color:var(--ink2)}
  .ibtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round}
  .ibtn .adot{width:16px;height:16px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 1px var(--line2)}

  /* ---------- shell ---------- */
  .shell{flex:1 1 auto;display:flex;min-height:0}
  .side{width:var(--side);flex:0 0 var(--side);background:var(--panel2);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 30px;display:flex;flex-direction:column;gap:3px}
  .side .glab{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding:14px 10px 6px;display:flex;align-items:center}
  .side .glab button{margin-left:auto;color:var(--accent-ink);font-size:15px;font-weight:700;line-height:1;padding:2px 6px;border-radius:6px}
  .side .glab button:hover{background:var(--accent-soft)}
  .navb{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);transition:.15s;width:100%;position:relative}
  .navb:hover{background:var(--hover)}
  .navb.on{background:var(--ink);color:var(--bg)}
  .navb.on .cnt{background:var(--inverse-soft2);color:var(--bg)}
  .navb .ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;flex:0 0 auto;opacity:.85}
  .navb .dot{width:8px;height:8px;border-radius:99px;flex:0 0 auto}
  .navb .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navb .cnt{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);background:var(--panel3);padding:1px 7px;border-radius:99px;flex:0 0 auto}
  .navb .catx{display:none;gap:2px;flex:0 0 auto}
  .navb:hover .catx{display:flex}
  .navb .catx button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
  .navb .catx button:hover{background:var(--hover2);color:var(--ink)}
  .navb .catx svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
  .side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);font-family:"JetBrains Mono",monospace;line-height:1.7}

  .main{flex:1 1 auto;min-width:0;overflow:auto;position:relative;background:var(--bg)}
  .bar{position:sticky;top:0;z-index:30;background:var(--bar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 20px}
  .bar .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar h2{font-family:"Bricolage Grotesque","Noto Sans SC",sans-serif;font-weight:800;font-size:18px;line-height:1.2}
  .bar .n{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
  .bar .sp{flex:1}
  .tgl{font-size:12.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);transition:.15s;white-space:nowrap}
  .tgl:hover{border-color:var(--ink)}
  .tgl.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .bar .r2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);transition:.15s;white-space:nowrap}
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .swatch{width:26px;height:26px;border-radius:99px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);transition:.15s}
  .swatch:hover{transform:scale(1.12)}
  .swatch.on{box-shadow:0 0 0 2px var(--ink)}

  .content{padding:16px 20px 90px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));align-content:start}
  .grid .cell{position:relative;aspect-ratio:4/3;border-radius:11px;overflow:hidden;background:var(--panel3);border:1px solid var(--line);cursor:pointer;transition:.18s var(--ease)}
  .grid .cell:hover{box-shadow:0 12px 26px -16px rgba(27,24,19,.6);transform:translateY(-2px);border-color:var(--line2)}
  .grid .cell img{width:100%;height:100%;object-fit:cover;transition:.3s}
  .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 8px;background:linear-gradient(transparent,rgba(20,17,13,.72));color:#fff;font-size:11.5px;line-height:1.35;opacity:0;transition:.2s}
  .cell:hover .cap{opacity:1}
  .cell .cap b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .cap span{opacity:.75;font-size:10.5px}
  .cell .chk{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.9);border:1.5px solid rgba(27,24,19,.25);display:none;place-items:center;transition:.15s}
  .cell .chk svg{width:14px;height:14px;stroke:var(--accent-on);fill:none;stroke-width:2.6;opacity:0}
  .selmode .cell .chk{display:grid}
  .cell.picked .chk{background:var(--accent);border-color:var(--accent)}
  .cell.picked .chk svg{opacity:1}
  .cell.picked{outline:2px solid var(--accent);outline-offset:-2px}
  .cell .cattag{position:absolute;right:7px;top:7px;font-size:10px;font-weight:600;color:#fff;padding:2px 8px;border-radius:99px;background:rgba(20,17,13,.6);backdrop-filter:blur(3px)}
  .wf{column-count:4;column-gap:12px}
  .wf .cell{aspect-ratio:auto;margin-bottom:12px;break-inside:avoid}
  .wf .cell img{width:100%;height:auto;display:block}
  .wf .cell .cap{opacity:1;position:static;background:none;color:var(--ink);padding:8px 10px 10px;font-size:12px}
  .wf .cell .cap b{color:var(--ink)}
  @media(max-width:1500px){.wf{column-count:3}}
  @media(max-width:1000px){.wf{column-count:2}}
  @media(max-width:600px){.wf{column-count:1}}
  .more{grid-column:1/-1;text-align:center;padding:16px}
  .more button{font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--line2);background:var(--panel);padding:9px 20px;border-radius:99px}
  .more button:hover{border-color:var(--accent);color:var(--accent-ink)}

  /* library cards */
  .libgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));align-content:start}
  .lcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;transition:.2s var(--ease)}
  .lcard:hover{box-shadow:0 16px 34px -22px rgba(27,24,19,.6);transform:translateY(-2px)}
  .lcard .ph{position:relative;cursor:zoom-in;background:var(--panel3)}
  .lcard .ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
  .lcard .col{position:absolute;right:9px;top:9px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);box-shadow:0 5px 14px -8px rgba(0,0,0,.5)}
  .lcard .col.got{background:var(--ok);color:#fff;border-color:var(--ok)}
  .lcard .col svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4}
  .lcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .lcard h3{font-size:14px;font-weight:700;line-height:1.35}
  .lcard p{font-size:12px;color:var(--muted);font-weight:300;line-height:1.5}
  .lcard .use{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-left:2px solid var(--accent);padding:6px 10px;border-radius:0 7px 7px 0;line-height:1.45}
  .lcard .use b{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.03em}
  .lcard .ft{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .lcard .ft a:hover{color:var(--accent-ink)}

  /* empty state */
  .empty{max-width:560px;margin:46px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 28px}
  .empty h3{font-family:"Bricolage Grotesque","Noto Sans SC",sans-serif;font-weight:800;font-size:20px}
  .empty p{color:var(--muted);font-size:13px;font-weight:300;margin:9px auto 0;max-width:44ch}
  .empty .zone{margin-top:20px;border:2px dashed var(--line2);border-radius:14px;background:var(--panel2);padding:26px 20px;transition:.2s;cursor:pointer}
  .empty .zone:hover,.empty .zone.over{border-color:var(--accent);background:var(--accent-soft)}
  .empty .zone b{display:block;font-size:14.5px}
  .empty .zone small{display:block;margin-top:6px;font-size:12px;color:var(--muted);font-weight:300}
  .empty .zb{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}

  /* trends / sources */
  .tgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .tr{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px 18px;transition:.2s}
  .tr:hover{border-color:var(--line2);box-shadow:0 14px 30px -22px rgba(27,24,19,.55)}
  .tr .no{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--accent-ink);letter-spacing:.09em}
  .tr h4{font-size:15px;font-weight:700;margin-top:8px}
  .tr em{display:block;font-style:italic;font-size:11.5px;color:var(--muted);margin-top:3px}
  .tr p{font-size:12.5px;color:var(--muted);font-weight:300;margin-top:8px}
  .sgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .sg{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
  .sg h4{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);font-family:"JetBrains Mono",monospace;text-transform:uppercase}
  .sg a{display:block;padding:8px 9px;border-radius:8px;transition:.15s}
  .sg a:hover{background:var(--panel3)}
  .sg a b{font-size:13px;font-weight:600}
  .sg a span{display:block;font-size:11.5px;color:var(--muted);font-weight:300;margin-top:1px}
  .sg .sl{margin-top:10px;display:flex;flex-direction:column;gap:1px}

  /* selection action bar */
  .selbar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);z-index:80;display:none;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:11px 14px 11px 18px;border-radius:14px;box-shadow:0 20px 44px -20px rgba(0,0,0,.7)}
  .selbar.show{display:flex}
  .selbar b{font-size:13.5px}
  .selbar .b2{font-size:12.5px;font-weight:500;background:var(--inverse-soft);padding:8px 13px;border-radius:9px;color:var(--bg);transition:.15s;position:relative}
  .selbar .b2:hover{background:var(--inverse-soft2)}
  .selbar .b2.danger:hover{background:var(--accent);color:var(--accent-on)}
  .selbar .x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--inverse-soft)}
  .selbar .x svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:2}
  .pop{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line2);border-radius:11px;box-shadow:0 22px 46px -20px rgba(0,0,0,.55);padding:6px;min-width:190px;max-height:60vh;overflow:auto;display:none}
  .pop.show{display:block}
  .pop button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink2)}
  .pop button:hover{background:var(--panel3)}
  .pop .dot{width:9px;height:9px;border-radius:99px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(20,17,13,.34);opacity:0;pointer-events:none;transition:.24s;z-index:100}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(0,0,0,.5);transform:translateX(102%);transition:.3s var(--ease);z-index:110;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .dh .ix{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted)}
  .dh .sp{flex:1}
  .dh button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel2);transition:.15s}
  .dh button:hover{background:var(--panel3)}
  .dh button svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
  .dimg{position:relative;background:var(--panel3);display:grid;place-items:center;min-height:180px;max-height:46vh;overflow:hidden}
  .dimg img{max-height:46vh;max-width:100%;object-fit:contain}
  .dimg .fs{position:absolute;right:10px;bottom:10px;background:rgba(20,17,13,.76);color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:99px;display:inline-flex;gap:5px;align-items:center}
  .dimg .fs svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
  .dbody{padding:16px 16px 26px;overflow:auto;display:flex;flex-direction:column;gap:13px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld label{font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .fld input,.fld select,.fld textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13.5px;outline:none;width:100%;transition:.15s}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .fld textarea{min-height:70px;resize:vertical}
  .dmeta{font-size:11.5px;color:var(--muted);font-family:"JetBrains Mono",monospace;display:flex;flex-wrap:wrap;gap:12px}
  .dact{display:flex;gap:9px;flex-wrap:wrap;padding-top:4px}

  /* toast */
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);z-index:400;display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:11px 17px;border-radius:99px;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:.28s}

</style>

/* ---------- 存储：IndexedDB，file:// 回退 localStorage ---------- */
const DBN='leiji3';
let MODE='idb', _db;
function openDB(){ return _db ||= new Promise((res,rej)=>{
  const r=indexedDB.open(DBN,2);
  r.onupgradeneeded=()=>{ const d=r.result; ['refs','cats','albums'].forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id'}); }); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const LSK=n=>'leiji3.'+n;
const lsGet=n=>{ try{ return JSON.parse(localStorage.getItem(LSK(n))||'[]'); }catch(e){ return []; } };
const lsSet=(n,a)=>{ try{ localStorage.setItem(LSK(n),JSON.stringify(a)); return 1; }catch(e){ toast('本地空间已满，先删掉一些或导出备份'); return 0; } };
async function boot(){ try{ await openDB(); MODE='idb'; }catch(e){ MODE='ls'; } }
async function sAll(n){ if(MODE==='idb'){ const d=await openDB(); return new Promise((s,j)=>{ const q=d.transaction(n,'readonly').objectStore(n).getAll(); q.onsuccess=()=>s(q.result||[]); q.onerror=()=>j(q.error); }); } return lsGet(n); }
async function sPut(n,o){ if(MODE==='idb'){ const d=await openDB(); return new Promise((s,j)=>{ const t=d.transaction(n,'readwrite'); t.objectStore(n).put(o); t.oncomplete=()=>s(); t.onerror=()=>j(t.error); }); } const a=lsGet(n),c=Object.assign({},o); delete c.blob; delete c._url; const i=a.findIndex(x=>x.id===o.id); if(i>=0)a[i]=c; else a.push(c); lsSet(n,a); }
async function sDel(n,id){ if(MODE==='idb'){ const d=await openDB(); return new Promise((s,j)=>{ const t=d.transaction(n,'readwrite'); t.objectStore(n).delete(id); t.oncomplete=()=>s(); t.onerror=()=>j(t.error); }); } lsSet(n,lsGet(n).filter(x=>x.id!==id)); }
async function sClear(n){ if(MODE==='idb'){ const d=await openDB(); return new Promise((s,j)=>{ const t=d.transaction(n,'readwrite'); t.objectStore(n).clear(); t.oncomplete=()=>s(); t.onerror=()=>j(t.error); }); } localStorage.removeItem(LSK(n)); }

function readPrefs(){ try{ Object.assign(PREFS, JSON.parse(localStorage.getItem(PREFS_KEY)||'{}')); }catch(e){} }
function applyPrefs(){ const r=document.documentElement;
  if(PREFS.theme==='dark') r.setAttribute('data-theme','dark'); else r.removeAttribute('data-theme');
  if(PREFS.accent==='lime') r.setAttribute('data-accent','lime'); else r.removeAttribute('data-accent');
  const tb=$('#themeBtn'); if(tb){ tb.innerHTML=(PREFS.theme==='dark')?ICON_SUN:ICON_MOON; tb.title=(PREFS.theme==='dark')?'切换浅色模式':'切换深色模式'; }
}
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); }catch(e){} }
function toggleTheme(){ PREFS.theme=(PREFS.theme==='dark')?'light':'dark'; applyPrefs(); savePrefs(); }
function pickAccent(){ showPop($('#accentBtn'),'强调色',[{n:'砖橙 · 默认',id:'iron',c:'#E4441D'},{n:'荧光黄绿 · 美叶同款',id:'lime',c:'#DFFF1F'}], id=>{ PREFS.accent=id; applyPrefs(); savePrefs(); }); }

function ask(title,val){ return new Promise(res=>{

/* ---------- 主色提取 ---------- */
function dominantColor(canvas){
  const w=Math.min(canvas.width,90), h=Math.min(canvas.height,90);
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const x=c.getContext('2d'); x.drawImage(canvas,0,0,w,h);
  let d; try{ d=x.getImageData(0,0,w,h).data; }catch(e){ return {hue:null,sat:0,hex:'#8A8378'}; }
  const buckets={};
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3]; if(a<125) continue;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b); const l=(mx+mn)/2/255;
    if(l>0.94||l<0.06) continue;               // 跳过过亮/过暗
    const s=mx===0?0:(mx-mn)/mx;
    if(s<0.14){ buckets['mono']=(buckets['mono']||0)+1; continue; }
    let hh; const df=mx-mn;
    if(mx===r) hh=((g-b)/df)%6; else if(mx===g) hh=(b-r)/df+2; else hh=(r-g)/df+4;
    hh=(hh*60+360)%360;
    const k=Math.round(hh/15)*15;
    buckets[k]=(buckets[k]||0)+1;
  }
  let best='mono',bn=-1; for(const k in buckets){ if(buckets[k]>bn){bn=buckets[k];best=k;} }
  if(best==='mono') return {hue:null,sat:0,hex:'#8A8378'};
  const hue=+best; return {hue, sat:1, hex:hsl(hue,58,48)};
}
function hsl(h,s,l){ const a=s*Math.min(l,1-l); const f=n=>{const k=(n+h/30)%12; return l-a*Math.max(-1,Math.min(k-3,9-k,1));}; return '#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join(''); }
function colorKeyOf(hue){ if(hue==null) return 'mono'; for(const c of COLORS){ if(!c.h) continue; const h=c.h; for(let i=0;i<h.length;i+=2){ let lo=h[i],hi=h[i+1]; if(lo<=hi){ if(hue>=lo&&hue<hi) return c.k; } else { if(hue>=lo||hue<hi) return c.k; } } } return 'mono'; }

/* ---------- 图片处理 ---------- */
function bitmap(blob){
  if(window.createImageBitmap) return createImageBitmap(blob).catch(()=>viaURL(blob));
  return viaURL(blob);
}
function viaURL(blob){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob); const im=new Image(); im.onload=()=>{res(im);URL.revokeObjectURL(u);}; im.onerror=rej; im.src=u; }); }
function scale(src,mw,mh){ const r=Math.min(1,mw/src.width,mh/src.height); const w=Math.max(1,Math.round(src.width*r)),h=Math.max(1,Math.round(src.height*r)); const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(src,0,0,w,h); return c; }
const cBlob=(c,ty,q)=>new Promise(res=>c.toBlob(b=>res(b),ty,q));
async function makeRef(blob,meta){
  const bmp=await bitmap(blob); const w=bmp.width||1,h=bmp.height||1;
  const col=dominantColor(bmp);
  const full=await cBlob(scale(bmp,1800,1800),'image/jpeg',0.9);
  const thumb=scale(bmp,560,560).toDataURL('image/jpeg',0.82);
  return { id:uid(), title:meta.title||'', note:meta.note||'', tags:meta.tags||[], src:meta.src||'', url:meta.url||'', author:meta.author||'',
    albums:[], f:{}, cat:meta.cat||'', hue:col.hue, sat:col.sat, hex:col.hex, thumb, blob:full||blob, w, h, createdAt:Date.now() };
}
function refUrl(m){ if(m.blob){ if(!m._url) m._url=URL.createObjectURL(m.blob); return m._url; } return m.imgUrl||m.thumb||''; }
function itemSrc(m){ return (m&&m._lib!=null)?libImg(ITEMS[m._lib],m._lib):refUrl(m); }

  }
  if(VIEW.kind==='albums'){
    if(!UALB.length){ c.innerHTML='<div class="empty"><h3>还没有专辑</h3><p>专辑能把同一张图放进多个参考语境——比如「餐饮门头」「红色系」「潮玩 IP」。点左侧「专辑」旁的 ＋ 新建，再到素材详情里勾选归属。</p></div>'; return; }
    c.innerHTML='<div class="albgrid" style="padding-top:4px">'+UALB.map(albumCard).join('')+'</div>'; return;
  }
  const list=matList();
  if(!MAT.length){ c.innerHTML=emptyMain(); bindEmpty(); return; }
  if(!list.length){ c.innerHTML=emptyLib('这个范围里还没有素材'); return; }
  c.innerHTML='<div class="'+(VMODE==='wf'?'wf':'grid')+'" id="grid"></div><div class="more" id="moreWrap"></div>';
  paint(list);
}
function paint(list){
  const wrap=$('#grid'), moreWrap=$('#moreWrap'); const step=72; let i=0; const isWF=VMODE==='wf';
  function add(){
    const end=Math.min(i+step,list.length); let html=''; for(;i<end;i++) html+=cardMat(list[i],isWF); wrap.insertAdjacentHTML('beforeend',html);
    if(i<list.length){ moreWrap.innerHTML='<button id="moreBtn">加载更多（还有 '+(list.length-i)+' 张）</button>'; $('#moreBtn').onclick=add; }
    else moreWrap.innerHTML='';
  }
  add();
}
function cardMat(m,isWF){
  const im=refUrl(m); const pick=SEL.has(m.id);
  const cap=(m.title||'')|| (m.src||'本地采集');
  const albs=(m.albums||[]).map(albName).filter(Boolean);
  const metas=[m.src||'', ...albs].filter(Boolean);
  const supx=metas.length?'<span>'+esc(metas.join(' · '))+'</span>':'';
  const ftags=(isWF&&(m.tags||[]).length)?'<span>#'+m.tags.map(esc).join(' #')+'</span>':'';
  return '<article class="cell'+(pick?' picked':'')+'" data-id="'+m.id+'">'
   +(m.cat?'<span class="cattag" style="background:'+catColor(m.cat)+'cc">'+esc(catName(m.cat))+'</span>':'')
   +'<span class="chk"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>'
   +'<button class="addalb" data-addalb="'+m.id+'" title="加入专辑"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg></button>'
   +'<img src="'+im+'" alt="'+esc(cap)+'" loading="lazy">'
   +'<span class="cap"><b>'+esc(cap)+'</b>'+supx+ftags+'</span></article>';
}
function cardLib(it,i){
  const got=isGot(it.t);
  return '<article class="lcard"><span class="ph" data-pl="'+i+'"><img src="'+libImg(it,i)+'" alt="'+esc(it.t)+'" loading="lazy" data-fb="'+coverSVG(it,i)+'" onerror="this.onerror=null;this.src=this.dataset.fb">'
   +'<button class="col'+(got?' got':'')+'" data-cl="'+i+'"><svg viewBox="0 0 24 24">'+(got?'<path d="M20 6 9 17l-5-5"/>':'<path d="M12 5v14M5 12h14"/>')+'</svg>'+(got?'已采集':'采集')+'</button></span>'
   +'<div class="bd"><h3>'+esc(it.t)+'</h3><p>'+esc(it.d)+'</p><div class="use"><b>看点 · </b>'+esc(it.use)+'</div>'
   +'<div class="ft"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">↗ '+esc(it.src)+'</a></div></div></article>';
}
function emptyMain(){
  return '<div class="empty"><h3>还没有素材 —— 现在就能开始收</h3><p>在别的网站复制图片、截图，回到这里按 Ctrl+V；也可以拖图片、传文件、或存一个网址。采集后可以分到不同分类，以后按分类、标签、颜色快速翻出来。</p>'
   +'<div class="zone" id="zoneHome"><b>拖图片到这里，或点我选图片</b><small>支持 Ctrl+V 粘贴 · 手机可长按保存截图后上传</small></div>'
   +'<div class="zb"><button class="tgl" id="zImp">打开采集面板</button><button class="tgl" id="zLib">去灵感库挑</button></div></div>';
}
function bindEmpty(){ const z=$('#zoneHome'); if(z) z.onclick=openImp; const a=$('#zImp'); if(a) a.onclick=openImp; const b=$('#zLib'); if(b) b.onclick=()=>setView('lib'); }
function emptyLib(t){ return '<div class="empty"><h3>'+esc(t)+'</h3><p>换个关键词，或清除筛选条件试试。</p></div>'; }
function renderSelbar(){ $('#selbar').classList.toggle('show',SELMODE&&SEL.size>0); $('#selN').textContent='已选 '+SEL.size; }

/* ---------- 灵感库兜底封面 ---------- */
function coverSVG(it,i){
  const c=(CATS.find(x=>x.key===it.cat)||{}).color||'#E4441D';
  const lb=(CATS.find(x=>x.key===it.cat)||{}).label||'灵感';
  const w=800,h=it.wide?560:1000;
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='"+w+"' height='"+h+"'><defs><pattern id='g"+i+"' width='40' height='40' patternUnits='userSpaceOnUse'><path d='M40 0H0V40' fill='none' stroke='"+c+"' stroke-opacity='.15'/></pattern></defs>"
   +"<rect width='"+w+"' height='"+h+"' fill='#FBF7EF'/><rect width='"+w+"' height='"+h+"' fill='url(#g"+i+")'/><rect width='"+w+"' height='12' fill='"+c+"'/>"
   +"<text x='46' y='"+h*0.56+"' font-family='Noto Sans SC,sans-serif' font-size='190' font-weight='900' fill='"+c+"' fill-opacity='.92'>"+lb+"</text>"
   +"<text x='48' y='"+(h*0.56+120)+"' font-family='Noto Sans SC,sans-serif' font-size='28' fill='#1A1712' fill-opacity='.5'>磊集 · 灵感参考</text></svg>";
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const libImg=(it,i)=>it.img||coverSVG(it,i);
const isGot=t=>MAT.some(m=>m.kind==='lib'&&m.title===t);

/* ---------- 采集入库 ---------- */
async function collect(it,i){
  if(isGot(it.t)) return;
  const c=UCATS.find(x=>x.hue===it.cat||x.name===catLabel(it.cat));
  const r={ id:uid(), kind:'lib', title:it.t, note:it.use||'', tags:it.tags||[], src:it.src, url:it.url, author:'', albums:(VIEW.kind==='album'&&VIEW.id)?[VIEW.id]:[], f:{}, cat:c?c.id:'',
    hue:null, sat:0, hex:'#8A8378', thumb:libImg(it,i), blob:null, imgUrl:'', w:0, h:0, createdAt:Date.now() };
  MAT.push(r); await sPut('refs',r); renderSide(); renderMain(); toast('已收进「'+(c?c.name:'未分类')+'」');
}
async function uncollect(t){ const r=MAT.find(m=>m.kind==='lib'&&m.title===t); if(!r) return; if(r._url)URL.revokeObjectURL(r._url); MAT=MAT.filter(m=>m.id!==r.id); await sDel('refs',r.id); renderSide(); renderMain(); toast('已取消采集'); }
const catLabel=key=>(CATS.find(c=>c.key===key)||{}).label||'';

let PEND=0;
async function addBlob(blob,meta){
  PEND++;
  try{ const r=await makeRef(blob,meta); if(VIEW.kind==='cat'&&VIEW.id) r.cat=VIEW.id; else if(meta.cat) r.cat=meta.cat;
    if(VIEW.kind==='album'&&VIEW.id) r.albums=[VIEW.id];
    MAT.push(r); await sPut('refs',r); renderSide(); renderMain(); addMini(r); }
  catch(e){ console.warn('采集失败',e); }
  PEND--; if(PEND===0) toast('已采集，自动按主色归类');
}
function addMini(r){ const l=$('#impList'); if(!l) return; const d=document.createElement('div'); d.className='it'; d.innerHTML='<img src="'+r.thumb+'"><span class="n">新增</span>'; l.appendChild(d); }
async function addUrl(u){ u=(u||'').trim(); if(!u) return; if(!/^https?:/i.test(u)) u='https://'+u;
  const r={ id:uid(), title:host(u)||u, note:'', tags:[], src:host(u), url:u, author:'', albums:(VIEW.kind==='album'&&VIEW.id)?[VIEW.id]:[], f:{}, cat:(VIEW.kind==='cat'?VIEW.id:''), hue:null, sat:0, hex:'#8A8378', thumb:u, imgUrl:u, blob:null, w:0, h:0, createdAt:Date.now() };
  MAT.push(r); await sPut('refs',r); renderSide(); renderMain(); toast('已存入网址参考'); }
function handleFiles(fs){ [...fs].filter(f=>f.type.startsWith('image/')).forEach(f=>addBlob(f,{})); }
function handlePaste(e){ let n=0; for(const x of ((e.clipboardData||{}).items||[])){ if(x.type&&x.type.startsWith('image/')){ const b=x.getAsFile(); if(b){ addBlob(b,{}); n++; } } } if(n){ e.preventDefault(); toast('正在采集 '+n+' 张…'); } }

/* ---------- 抽屉 ---------- */
function openDrawer(list,i){ DLS={list,i}; $('#drawer').classList.add('open'); $('#scrim').classList.add('show'); paintDrawer(); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('show'); }
function paintDrawer(){
  const m=DLS.list[DLS.i]; if(!m) return;
  $('#dIdx').textContent=(DLS.i+1)+' / '+DLS.list.length;
  $('#dImg').src=refUrl(m);
  $('#dTitle').value=m.title||''; $('#dNote').value=m.note||'';
  renderCatSelect(); $('#dCat').value=m.cat||'';
  renderTagbox(m); renderAlbBox(m); renderFacets(m);
  $('#dSrcName').value=m.src||''; $('#dAuthor').value=m.author||'';
  $('#dSrc').innerHTML=m.url?'<a href="'+esc(m.url)+'" target="_blank" rel="noopener" style="color:var(--accent-ink)">↗ '+esc(m.src||host(m.url))+'</a>':'<span style="color:var(--muted)">本地采集</span>';
  $('#dMeta').innerHTML='<span>'+m.w+'×'+m.h+'</span><span>'+new Date(m.createdAt).toLocaleDateString('zh-CN')+'</span>'+(m.hex?'<span><i class="swatchdot" style="background:'+m.hex+'"></i>主色 '+m.hex+'</span>':'');
}
function renderTagbox(m){ const b=$('#dTagBox'); b.innerHTML=(m.tags||[]).map(t=>'<i>#'+esc(t)+'<button data-rt="'+esc(t)+'">×</button></i>').join('')||'<span style="font-size:12px;color:var(--muted);font-weight:300">还没有标签</span>'; }
function renderAlbBox(m){
  const mine=m.albums||[];
  $('#dAlbBox').innerHTML=(UALB.length?'':'<span class="hint">还没有专辑，点右边新建一个。</span>')
    +UALB.map(a=>'<button class="'+(mine.includes(a.id)?'on':'')+'" data-alb="'+a.id+'"><span class="sw" style="background:'+a.color+'"></span>'+esc(a.name)+'</button>').join('')
    +'<button data-alb="__new">＋ 新建专辑</button>';
}
function renderFacets(m){
  const f=m.f||{};
  $('#dFacets').innerHTML=DIMS.map(d=>'<select data-fk="'+d.k+'"><option value="">'+d.n+'：不限</option>'
    +d.vals.map(v=>'<option value="'+esc(v)+'"'+(f[d.k]===v?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select>').join('');
}
function renderCatSelect(){ const s=$('#dCat'); s.innerHTML='<option value="">未分类</option>'+UCATS.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join(''); }
function dMove(d){ if(!DLS.list.length) return; DLS.i=(DLS.i+d+DLS.list.length)%DLS.list.length; paintDrawer(); }
async function dSave(){ const m=DLS.list[DLS.i]; if(!m) return; m.title=$('#dTitle').value.trim(); m.note=$('#dNote').value.trim(); m.cat=$('#dCat').value; m.src=$('#dSrcName').value.trim(); m.author=$('#dAuthor').value.trim(); await sPut('refs',m); renderSide(); renderMain(); paintDrawer(); toast('已保存'); }
function dDownload(){ const m=DLS.list[DLS.i]; const a=document.createElement('a'); a.href=refUrl(m); a.download=(m.title||'leiji')+'.jpg'; document.body.appendChild(a); a.click(); a.remove(); }
async function dDelete(){ const m=DLS.list[DLS.i]; if(!m) return; if(!await askConfirm('删除素材','确定删除「'+(m.title||'未命名')+'」？不可恢复。','删除')) return; if(m._url)URL.revokeObjectURL(m._url); MAT=MAT.filter(x=>x.id!==m.id); await sDel('refs',m.id); DLS.list=DLS.list.filter(x=>x.id!==m.id); renderSide(); renderMain(); if(DLS.list.length){ DLS.i=Math.min(DLS.i,DLS.list.length-1); paintDrawer(); } else closeDrawer(); toast('已删除'); }

/* ---------- 灯箱 ---------- */
function openLB(list,i){ DLS.list=list; DLS.i=i; $('#lb').classList.add('open'); paintLB(); }
function paintLB(){ const m=DLS.list[DLS.i]; if(!m) return; $('#lbImg').src=itemSrc(m); $('#lbIdx').textContent=(DLS.i+1)+' / '+DLS.list.length; }
function closeLB(){ $('#lb').classList.remove('open'); }
function lbMove(d){ if(!DLS.list.length) return; DLS.i=(DLS.i+d+DLS.list.length)%DLS.list.length; paintLB(); }

/* ---------- 批量 ---------- */
function moveSelected(){
  const btn=$('#selMove'); showPop(btn,'移动到分类', [{n:'未分类',id:''}].concat(UCATS.map(c=>({n:c.name,id:c.id,c:c.color}))),async id=>{ for(const m of MAT.filter(x=>SEL.has(x.id))){ m.cat=id; await sPut('refs',m); } toast('已移动 '+SEL.size+' 张'); SEL.clear(); renderSide(); renderMain(); });
}
async function tagSelected(){ const t=await ask('给选中的 '+SEL.size+' 张加标签（逗号分隔）',''); if(!t) return; const add=t.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  for(const m of MAT.filter(x=>SEL.has(x.id))){ m.tags=[...new Set([...(m.tags||[]),...add])]; await sPut('refs',m); } toast('已加标签'); renderMain(); }
async function delSelected(){ if(!await askConfirm('删除素材','将删除选中的 '+SEL.size+' 张素材，不可恢复。','删除')) return; for(const m of MAT.filter(x=>SEL.has(x.id))){ if(m._url)URL.revokeObjectURL(m._url); await sDel('refs',m.id); } MAT=MAT.filter(x=>!SEL.has(x.id)); SEL.clear(); renderSide(); renderMain(); toast('已删除'); }
function showPop(anchor,title,items,cb){
  const p=$('#pop');
  p.innerHTML='<div style="padding:6px 10px;font-size:10.5px;font-family:JetBrains Mono,monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase">'+esc(title)+'</div>'
    +items.map(it=>'<button data-pid="'+esc(it.id)+'">'+(it.c?'<span class="dot" style="background:'+it.c+'"></span>':'')+esc(it.n)+'</button>').join('');
  p.classList.add('show');
  const r=anchor.getBoundingClientRect(), ph=p.offsetHeight, pw=p.offsetWidth;
  let left=Math.min(Math.max(10,r.left), innerWidth-pw-10);
  let top=r.top-ph-8; if(top<10) top=r.bottom+8;
  p.style.left=left+'px'; p.style.top=top+'px';
  p.onclick=e=>{ const b=e.target.closest('[data-pid]'); if(!b) return; p.classList.remove('show'); p.onclick=null; cb(b.dataset.pid); };
  setTimeout(()=>document.addEventListener('click',hidePop,{once:true}),0);
}
function hidePop(){ $('#pop').classList.remove('show'); }
function clearFilters(){ COLORSEL=null; TAGSEL.clear(); DIMS.forEach(d=>FSEL[d.k]=''); renderSide(); renderMain(); }
function albumForOne(id){
  const m=MAT.find(x=>x.id===id); if(!m) return;
  const btn=$('#content').querySelector('.cell[data-id="'+id+'"] .addalb')||$('#selAlb');
  const mine=m.albums||[];
  const items=UALB.map(a=>({n:(mine.includes(a.id)?'✓ ':'')+a.name,id:a.id,c:a.color})).concat([{n:'＋ 新建专辑',id:'__new'}]);
  showPop(btn,'加入专辑 · '+(m.title||'未命名'),items,async aid=>{
    if(aid==='__new'){ aid=await newAlb(); if(!aid) return; }
    m.albums=[...new Set([...(m.albums||[]),aid])]; await sPut('refs',m); renderSide(); renderMain(); toast('已加入「'+albName(aid)+'」');
  });
}

/* ---------- 视图切换 ---------- */
function setView(kind,id){ VIEW={kind,id:id||''}; SEL.clear(); SELMODE=false; Q=''; $('#q').value=''; DIMS.forEach(d=>FSEL[d.k]=''); if(kind!=='lib') FILTERCAT='all'; renderSide(); renderMain(); $('#main').scrollTop=0; $('#side').classList.remove('open'); }

/* ---------- 事件 ---------- */
function bind(){
  document.addEventListener('paste',handlePaste);
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer&&e.dataTransfer.files; if(f&&f.length) handleFiles(f); });
  const z=$('#impZone'); if(z){ z.onclick=pick;
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);}); }

  $('#side').addEventListener('click',e=>{
    const rn=e.target.closest('[data-rn]'); if(rn){ e.stopPropagation(); renameCat(rn.dataset.rn); return; }
    const dc=e.target.closest('[data-dc]'); if(dc){ e.stopPropagation(); delCat(dc.dataset.dc); return; }
    const arn=e.target.closest('[data-arn]'); if(arn){ e.stopPropagation(); renameAlb(arn.dataset.arn); return; }
    const adc=e.target.closest('[data-adc]'); if(adc){ e.stopPropagation(); delAlb(adc.dataset.adc); return; }
    const dg=e.target.closest('[data-dgk]'); if(dg){ const k=dg.dataset.dgk; DOPEN[k]=!DOPEN[k]; renderSide(); return; }
    const fv=e.target.closest('[data-dk]'); if(fv){ const k=fv.dataset.dk,v=fv.dataset.dv; FSEL[k]=FSEL[k]===v?'':v; SEL.clear(); renderSide(); renderMain(); return; }
    const b=e.target.closest('[data-view]'); if(!b) return; setView(b.dataset.view, b.dataset.id||'');
  });
  $('#newCat').onclick=newCat;
  $('#newAlb').onclick=()=>newAlb();
  $('#sideToggle').onclick=()=>$('#side').classList.toggle('open');

  $('#q').addEventListener('input',e=>{ Q=e.target.value; if(Q&&['lib','trends','sources','albums'].includes(VIEW.kind)) return; renderMain(); });
  $('#sort').addEventListener('change',e=>{ SORT=e.target.value; renderMain(); });
  $('#dens').addEventListener('click',e=>{ const b=e.target.closest('[data-d]'); if(!b) return; DENSITY=+b.dataset.d; $$('#dens button').forEach(x=>x.classList.toggle('on',x===b)); document.documentElement.style.setProperty('--cw',CW[DENSITY]); });
  $('#vmode').addEventListener('click',e=>{ const b=e.target.closest('[data-v]'); if(!b) return; VMODE=b.dataset.v; $$('#vmode button').forEach(x=>x.classList.toggle('on',x===b)); renderMain(); });
  $('#selToggle').onclick=()=>{ SELMODE=!SELMODE; if(!SELMODE) SEL.clear(); $('#selToggle').classList.toggle('on',SELMODE); renderMain(); };
  $('#selX').onclick=()=>{ SELMODE=false; SEL.clear(); $('#selToggle').classList.remove('on'); renderMain(); };
  $('#selMove').onclick=()=>moveSelected();
  $('#selAlb').onclick=()=>addSelToAlbum();
  $('#selTag').onclick=()=>tagSelected();
  $('#selDel').onclick=()=>delSelected();

  $('#content').addEventListener('click',e=>{
    const cl=e.target.closest('[data-cl]'); if(cl){ const i=+cl.dataset.cl, it=ITEMS[i]; isGot(it.t)?uncollect(it.t):collect(it,i); return; }
    const pl=e.target.closest('[data-pl]'); if(pl){ const i=+pl.dataset.pl; openLB([Object.assign({},ITEMS[i],{_lib:i})],0); return; }
    const ab=e.target.closest('[data-addalb]'); if(ab){ e.stopPropagation(); albumForOne(ab.dataset.addalb); return; }
    const fc=e.target.closest('[data-fc]'); if(fc){ FILTERCAT=fc.dataset.fc; renderBar(); renderContent(); return; }
    const av=e.target.closest('.albcard[data-view]'); if(av){ setView('album', av.dataset.id); return; }
    const sw=e.target.closest('[data-color]'); if(sw){ COLORSEL=COLORSEL===sw.dataset.color?null:sw.dataset.color; renderMain(); return; }
    const tg=e.target.closest('[data-tag]'); if(tg){ const t=tg.dataset.tag; TAGSEL.has(t)?TAGSEL.delete(t):TAGSEL.add(t); renderMain(); return; }
    const cf=e.target.closest('#clearF'); if(cf){ clearFilters(); return; }
    const cell=e.target.closest('.cell'); if(cell){ const id=cell.dataset.id; const m=MAT.find(x=>x.id===id); if(!m) return;
      if(SELMODE){ SEL.has(id)?SEL.delete(id):SEL.add(id); cell.classList.toggle('picked'); renderSelbar(); return; }
      const list=matList(); openDrawer(list, list.findIndex(x=>x.id===id)); return; }
  });

  $('#r2').addEventListener('click',e=>{
    const fc=e.target.closest('[data-fc]'); if(fc){ FILTERCAT=fc.dataset.fc; renderBar(); renderContent(); return; }
    const sw=e.target.closest('[data-color]'); if(sw){ COLORSEL=COLORSEL===sw.dataset.color?null:sw.dataset.color; renderMain(); return; }
    const tg=e.target.closest('[data-tag]'); if(tg){ const t=tg.dataset.tag; TAGSEL.has(t)?TAGSEL.delete(t):TAGSEL.add(t); renderMain(); return; }
    const fcl=e.target.closest('[data-fclr]'); if(fcl){ FSEL[fcl.dataset.fclr]=''; renderSide(); renderMain(); return; }
    const cf=e.target.closest('#clearF'); if(cf){ clearFilters(); return; }
  });

  $('#dClose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
  $('#dPrev').onclick=()=>dMove(-1); $('#dNext').onclick=()=>dMove(1);
  $('#dSave').onclick=dSave; $('#dDl').onclick=dDownload; $('#dDel').onclick=dDelete;
  $('#dCat').addEventListener('change',()=>{ const m=DLS.list[DLS.i]; if(m){ m.cat=$('#dCat').value; sPut('refs',m); renderSide(); renderMain(); } });
  $('#dTagAdd').onclick=()=>{ const v=$('#dTagInput').value.trim(); if(!v) return; const m=DLS.list[DLS.i]; m.tags=[...new Set([...(m.tags||[]),...v.split(/[,，]/).map(s=>s.trim()).filter(Boolean)])]; $('#dTagInput').value=''; sPut('refs',m); renderTagbox(m); renderMain(); };
  $('#dTagInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#dTagAdd').click(); });
  $('#dTagBox').addEventListener('click',e=>{ const rt=e.target.closest('[data-rt]'); if(!rt) return; const m=DLS.list[DLS.i]; m.tags=(m.tags||[]).filter(t=>t!==rt.dataset.rt); sPut('refs',m); renderTagbox(m); renderMain(); });
  $('#dAlbBox').addEventListener('click',async e=>{
    const b=e.target.closest('[data-alb]'); if(!b) return; const m=DLS.list[DLS.i]; if(!m) return;
    if(b.dataset.alb==='__new'){ const id=await newAlb(); if(!id) return; m.albums=[...new Set([...(m.albums||[]),id])]; await sPut('refs',m); renderSide(); renderMain(); renderAlbBox(m); return; }
    const id=b.dataset.alb; m.albums=(m.albums||[]).includes(id)?(m.albums||[]).filter(x=>x!==id):[...(m.albums||[]),id];
    await sPut('refs',m); renderSide(); renderMain(); renderAlbBox(m);
  });
  $('#dFacets').addEventListener('change',async e=>{
    const s=e.target.closest('[data-fk]'); if(!s) return; const m=DLS.list[DLS.i]; if(!m) return;
    m.f=m.f||{}; m.f[s.dataset.fk]=s.value; await sPut('refs',m); renderSide(); renderMain();
  });
  $('#dFs').onclick=()=>{ const m=DLS.list[DLS.i]; if(m) openLB(DLS.list,DLS.i); };

  $('#themeBtn').onclick=toggleTheme;
  $('#accentBtn').onclick=pickAccent;

  $('#openImp').onclick=openImp; $('#impBtn').onclick=openImp; $('#impX').onclick=closeImp; $('#imp').addEventListener('click',e=>{ if(e.target.id==='imp') closeImp(); });
  $('#urlAdd').onclick=()=>{ addUrl($('#urlIn').value); $('#urlIn').value=''; };
  $('#urlIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ addUrl(e.target.value); e.target.value=''; } });

  $('#lbX').onclick=closeLB; $('#lbPrev').onclick=()=>lbMove(-1); $('#lbNext').onclick=()=>lbMove(1);
  $('#lb').addEventListener('click',e=>{ if(e.target.id==='lb'||e.target.id==='lbStage') closeLB(); });
  document.addEventListener('keydown',e=>{
    if($('#lb').classList.contains('open')){ if(e.key==='Escape')closeLB(); else if(e.key==='ArrowLeft')lbMove(-1); else if(e.key==='ArrowRight')lbMove(1); return; }
    if($('#drawer').classList.contains('open')){ if(e.key==='Escape')closeDrawer(); else if(e.key==='ArrowLeft')dMove(-1); else if(e.key==='ArrowRight')dMove(1); }
  });
}
function openImp(){ $('#imp').classList.add('open'); $('#impList').innerHTML=''; setTimeout(()=>$('#urlIn').focus(),80); }
function closeImp(){ $('#imp').classList.remove('open'); }
function pick(){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.multiple=true; i.onchange=()=>handleFiles(i.files); i.click(); }

/* ---------- 启动 ---------- */
(async function init(){
  try{ await boot(); MAT=await sAll('refs'); UCATS=await sAll('cats'); UALB=await sAll('albums'); }catch(e){ console.warn('存储不可用',e); }
  if(!UCATS.length){ UCATS=seedCats(); for(const c of UCATS) await sPut('cats',c); }
  readPrefs(); bind(); applyPrefs(); renderSide(); renderCatSelect(); renderMain();
})();
</script>
</body>
</html>
